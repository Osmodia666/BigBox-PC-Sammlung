<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BigBox">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>BigBox Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  --paper:#f7f5f2; --paper-raised:#fffdf9; --ink:#1c1a16; --ink-dim:#65605a;
  --line:#e2ded4; --shelf:#16181d; --shelf-raised:#22252c; --shelf-line:#33373f;
  --shelf-ink:#fbfaf7; --shelf-ink-dim:#a8a29a; --brass:#b8862a; --brass-bright:#e8b13c;
  --good:#3f7d5c; --good-bg:#e4f0e7; --warn:#a3641f; --warn-bg:#f5e8d4; --bad:#a3402f; --bad-bg:#f5dfd9;
  --neutral-bg:#eeebe3; --shadow: 0 10px 30px -12px rgba(28,26,22,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131316; --paper-raised:#1b1c20; --ink:#f2efe9; --ink-dim:#a19b8e;
    --line:#2c2c30; --shelf:#0c0d10; --shelf-raised:#1a1c21; --shelf-line:#2c2f36;
    --neutral-bg:#232327;
  }
}
:root[data-theme="dark"]{
  --paper:#131316; --paper-raised:#1b1c20; --ink:#f2efe9; --ink-dim:#a19b8e;
  --line:#2c2c30; --shelf:#0c0d10; --shelf-raised:#1a1c21; --shelf-line:#2c2f36;
  --neutral-bg:#232327;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;font-family:'Zilla Slab',Georgia,serif;text-wrap:balance}
input,select,textarea,button{font-family:inherit}
::selection{background:var(--brass-bright);color:#1c1a16}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);position:relative}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.tnum{font-variant-numeric:tabular-nums}

.bar{background:var(--shelf);color:var(--shelf-ink);padding:calc(14px + env(safe-area-inset-top)) 18px 14px}
.bar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;color:var(--shelf-ink-dim);text-transform:uppercase}
.bar h1{font:600 22px/1.15 'Zilla Slab',serif;color:var(--shelf-ink);margin-top:3px}
.chip-value{flex:none;background:var(--shelf-raised);border:1px solid var(--shelf-line);border-radius:10px;padding:9px 12px;text-align:right;cursor:pointer}
.chip-value .eyebrow{color:var(--shelf-ink-dim)}
.chip-value .v{font:600 17px/1.2 'Zilla Slab',serif;color:var(--brass-bright);margin-top:3px}
.backbar{display:flex;align-items:center;gap:12px;background:var(--shelf);color:var(--shelf-ink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.iconbtn{width:34px;height:34px;border-radius:9px;background:var(--shelf-raised);border:1px solid var(--shelf-line);display:flex;align-items:center;justify-content:center;cursor:pointer;font:500 16px 'IBM Plex Mono',monospace;color:var(--shelf-ink);flex:none}
.backbar .title{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--shelf-ink-dim);text-transform:uppercase}
.backbar .title.center{flex:1;text-align:center}
.backbar .spacer{flex:1}
.linkbtn{font:500 13px/1 'IBM Plex Sans',sans-serif;color:var(--shelf-ink-dim);cursor:pointer;background:none;border:0;padding:8px}
.linkbtn.accent{color:var(--brass-bright)}
.hdrbtn{font:600 13px/1 'IBM Plex Sans',sans-serif;cursor:pointer;border-radius:9px;padding:10px 16px;border:1px solid var(--shelf-line)}
.hdrbtn.ghost{background:var(--shelf-raised);color:var(--shelf-ink)}
.hdrbtn.accent{background:var(--brass-bright);color:#1c1a16;border-color:var(--brass-bright)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px}
.section-title{padding:16px 18px 8px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase}

.shelf-row{padding:0 14px 20px}
.shelf-label{padding:2px 6px 10px;font:600 13px/1.2 'Zilla Slab',serif;color:var(--ink)}
.shelf-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 6px 14px;scroll-snap-type:x proximity}
.spine{scroll-snap-align:start;flex:none;width:112px;min-height:152px;border-radius:5px 8px 8px 5px;position:relative;cursor:pointer;box-shadow:0 5px 12px -4px rgba(0,0,0,.35);overflow:hidden;background-size:cover;background-position:center}
.spine::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:rgba(0,0,0,.28)}
.spine .inner{position:absolute;inset:0;padding:10px 9px 8px 15px;display:flex;flex-direction:column;gap:5px}
.spine .inner.shade{background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55) 70%)}
.spine .stripe{height:3px;border-radius:2px;background:rgba(255,255,255,.85);width:46%}
.spine .name{font:600 11px/1.18 'Zilla Slab',serif;color:#fff;text-wrap:pretty;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.spine .meta{margin-top:auto;font:500 8.5px/1.25 'IBM Plex Mono',monospace;letter-spacing:.03em;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.shelf-plank{height:9px;border-radius:2px;background:linear-gradient(#c9c1b4,#a89e8d);box-shadow:0 3px 6px rgba(0,0,0,.18);margin:0 6px}
.shelf-plank-shadow{height:5px;margin:0 15px;border-radius:0 0 3px 3px;background:#8f8676}

.list{padding:0 16px 20px;display:flex;flex-direction:column;gap:8px}
.card{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left}
.thumb{width:40px;height:52px;border-radius:4px;flex:none;background-size:cover;background-position:center}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card .title{font:600 14px/1.2 'Zilla Slab',serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font:400 11px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.badge{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.02em;padding:5px 7px;border-radius:6px;white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.neutral{background:var(--neutral-bg);color:var(--ink-dim)}
.badge.trade{background:var(--brass-bright);color:#1c1a16}
.wert{font:600 12px/1 'IBM Plex Mono',monospace;color:var(--ink)}
.empty{padding:40px 24px;text-align:center;font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}

.searchbar{display:flex;align-items:center;gap:9px;background:var(--shelf-raised);border:1px solid var(--shelf-line);border-radius:11px;padding:11px 13px}
.searchbar input{flex:1;background:transparent;border:0;outline:0;color:var(--shelf-ink);font:400 15px 'IBM Plex Sans',sans-serif}
.searchbar input::placeholder{color:var(--shelf-ink-dim)}
.searchbar .ico{font:400 14px 'IBM Plex Mono',monospace;color:var(--shelf-ink-dim)}
.chiprow{display:flex;gap:7px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
.filterchip{flex:none;font:500 11px/1 'IBM Plex Sans',sans-serif;padding:8px 12px;border-radius:20px;border:1px solid var(--shelf-line);background:var(--shelf-raised);color:var(--shelf-ink-dim);cursor:pointer;white-space:nowrap}
.filterchip.active{background:var(--brass-bright);border-color:var(--brass-bright);color:#1c1a16}
.resultcount{padding:12px 16px 6px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}

.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:transparent;pointer-events:none;padding:0 0 calc(10px + env(safe-area-inset-bottom))}
.tabbar-inner{pointer-events:auto;max-width:480px;width:calc(100% - 24px);margin:0 12px;display:flex;background:var(--shelf);border:1px solid var(--shelf-line);border-radius:16px;box-shadow:var(--shadow);overflow:visible;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px 9px;cursor:pointer;color:var(--shelf-ink-dim);background:none;border:0}
.tab.active{color:var(--brass-bright)}
.tab .ic{font:400 18px/1 'IBM Plex Mono',monospace}
.tab .lb{font:500 9.5px/1 'IBM Plex Sans',sans-serif;letter-spacing:.02em}
.fab{pointer-events:auto;position:absolute;left:50%;top:0;transform:translate(-50%,-58%);width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--brass-bright),var(--brass));border:4px solid var(--paper);box-shadow:0 8px 18px -6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#1c1a16;font:400 26px/1 'IBM Plex Sans',sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fab{border-color:var(--paper)} }
:root[data-theme="dark"] .fab{border-color:var(--paper)}

.detail-hero{padding:20px 16px 24px;background:var(--paper-raised)}
.detail-top{display:flex;gap:16px;align-items:flex-start}
.cover{width:88px;height:118px;border-radius:6px;flex:none;position:relative;overflow:hidden;box-shadow:0 6px 16px -6px rgba(0,0,0,.4);background-size:cover;background-position:center}
.cover .inner{position:absolute;inset:0;padding:12px 10px;display:flex;flex-direction:column;gap:7px}
.cover .inner.shade{background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55) 70%)}
.cover .stripe{height:3px;border-radius:2px;background:rgba(255,255,255,.85);width:50%}
.cover .name{font:600 13px/1.15 'Zilla Slab',serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cover .pub{margin-top:auto;font:500 8.5px/1.2 'IBM Plex Mono',monospace;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.detail-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.detail-meta h2{font:600 20px/1.14 'Zilla Slab',serif;color:var(--ink)}
.detail-line{font:400 12.5px/1.5 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.valuebox{margin-top:18px;background:var(--shelf);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.valuebox .lb{font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--shelf-ink-dim);text-transform:uppercase}
.valuebox .v{font:600 24px/1 'Zilla Slab',serif;color:var(--brass-bright)}
.rows{margin-top:18px;display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:14px;padding:11px 13px;background:var(--paper-raised)}
.row .k{font:400 12px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.row .v{font:500 12px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink);text-align:right}
.pcnote{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--neutral-bg);font:400 11.5px/1.5 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.actions{margin-top:20px;display:flex;gap:10px}
.btn{flex:1;text-align:center;padding:14px;border-radius:11px;font:500 14px/1 'IBM Plex Sans',sans-serif;cursor:pointer;border:1px solid transparent}
.btn.primary{background:var(--shelf);color:var(--shelf-ink)}
.btn.ghost{background:var(--paper-raised);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.form{padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field .lb{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.1em;color:var(--ink-dim);text-transform:uppercase}
.field input[type=text],.field input[type=number],.field input[type=url],.field input[type=password],.field select,.field textarea{border:1px solid var(--line);background:var(--paper-raised);border-radius:9px;padding:11px 12px;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--ink);width:100%}
.field textarea{resize:vertical;min-height:56px}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{font:500 12px/1 'IBM Plex Sans',sans-serif;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);cursor:pointer}
.pill.active{background:var(--shelf);border-color:var(--shelf);color:var(--shelf-ink)}
.checkline{display:flex;align-items:center;gap:9px;cursor:pointer}
.checkline input{width:18px;height:18px}

.menu{padding:0 16px;display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden;margin:0 0 20px}
.menu-item{display:flex;justify-content:space-between;align-items:center;padding:15px 15px;background:var(--paper-raised);border:1px solid var(--line);margin-top:-1px;cursor:pointer}
.menu-item .t{font:500 14px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink)}
.menu-item .s{font:400 11.5px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink-dim);margin-top:2px}
.menu-item .arrow{font:400 15px 'IBM Plex Mono',monospace;color:var(--ink-dim)}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
.stat-tile{background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.stat-tile .lb{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
.stat-tile .v{margin-top:6px;font:600 22px/1 'Zilla Slab',serif;color:var(--ink)}
.stat-tile .v.accent{color:var(--brass-bright)}
.bars{padding:4px 16px 20px;display:flex;flex-direction:column;gap:10px}
.barline{display:flex;align-items:center;gap:10px}
.barline .lb{width:118px;flex:none;font:400 12px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barline .track{flex:1;height:10px;border-radius:5px;background:var(--neutral-bg);overflow:hidden}
.barline .fill{height:100%;border-radius:5px;background:var(--brass-bright)}
.barline .n{width:30px;flex:none;text-align:right;font:500 11px/1 'IBM Plex Mono',monospace;color:var(--ink-dim)}

.sync-body{padding:18px 16px 100px;display:flex;flex-direction:column;gap:18px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sync-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:14px;padding:18px}
.sync-card h3{font:600 15px/1.3 'Zilla Slab',serif;color:var(--ink);margin-bottom:6px}
.sync-card p{margin:0;font:400 12.5px/1.6 'IBM Plex Sans',sans-serif;color:var(--ink-dim)}
.sync-meta{margin-top:12px;font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-dim)}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.sync-dot.ok{background:var(--good)}
.sync-dot.bad{background:var(--bad)}
.sync-dot.off{background:var(--ink-dim)}
.filepick{display:none}

.scanwrap{position:relative;aspect-ratio:4/3;max-height:320px;border-radius:14px;overflow:hidden;background:#000}
.scanwrap video{width:100%;height:100%;object-fit:cover}
.scanwrap .frame{position:absolute;inset:18%;border:2px solid var(--brass-bright);border-radius:8px;pointer-events:none}

.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--shelf);color:var(--shelf-ink);border:1px solid var(--shelf-line);border-radius:12px;padding:13px 16px;font:400 13px/1.4 'IBM Plex Sans',sans-serif;box-shadow:var(--shadow);z-index:50;max-width:448px;margin:0 auto;text-align:center}
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.confirm-sheet{width:100%;max-width:480px;background:var(--paper);border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto}
.confirm-sheet h3{font:600 17px/1.3 'Zilla Slab',serif;margin-bottom:8px}
.confirm-sheet p{font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:var(--ink-dim);margin:0 0 18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------------- desktop / wide-viewport layout ----------------
   Below this width the app is the single-column phone layout as-is.
   Above it: browse screens (Regal, Suche, Wunschliste game lists)
   widen into multi-column grids so the screen gets used; detail/edit/
   settings screens stay a comfortable, centered reading width instead
   of stretching form fields edge to edge. */
@media (min-width: 760px){
  .app{max-width:1180px}
  .bar{padding-left:32px;padding-right:32px}
  .backbar{padding-left:24px;padding-right:24px}
  .shelf-row{padding-left:26px;padding-right:26px}
  .shelf-scroll{flex-wrap:wrap;overflow-x:visible;scroll-snap-type:none}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));padding-left:26px;padding-right:26px;gap:10px}
  .card{width:100%}

  .detail-hero,.form,.sync-body,.stat-grid,.bars,.menu,.empty{max-width:680px;margin-left:auto;margin-right:auto}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .tabbar-inner{max-width:560px}
}
</style>
</head>

/* ---------------- Tauschliste (peer-to-peer trade sharing) ----------------
   No backend of our own: each collector publishes a small JSON file
   (only their tauschbar=Ja games) at any public URL they control (e.g.
   a Nextcloud public share link) and shares that URL as an "invite
   link". Friends' devices just fetch()  that URL directly - nothing
   flows through us. */
function buildTauschliste(){
  var profile = loadProfile();
  var games = state.games.filter(function(g){ return g.tauschbar === "Ja"; }).map(function(g){
    return { name:g.name, jahr:g.jahr, publisher:g.publisher, entwickler:g.entwickler, medium:g.medium, zustand:g.zustand, genre:g.genre, wert:g.wert, coverBase64:g.coverBase64, coverExt:g.coverExt };
  });
  return { owner: profile.displayName || "Unbenannt", updatedAt: Date.now(), games: games };
}
function exportTauschlisteFile(){
  var blob = new Blob([JSON.stringify(buildTauschliste(), null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tauschliste.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
function pushTauschlisteToNextcloud(){
  var nc = loadNC();
  if(!nc.url) return Promise.reject(new Error("Keine Nextcloud-Verbindung eingerichtet."));
  var siblingUrl = nc.url.replace(/[^/]*$/, "tauschliste.json");
  return fetch(siblingUrl, {
    method: "PUT",
    headers: { "Authorization": ncAuthHeader(nc), "Content-Type": "application/json" },
    body: JSON.stringify(buildTauschliste(), null, 2)
  }).then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return siblingUrl; });
}

var friendDataCache = {}; /* url -> {status:'loading'|'ok'|'error', owner, games, error, newNames} */
function fetchFriendList(friend){
  friendDataCache[friend.url] = { status: "loading" };
  fetch(friend.url, { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(data){
      var games = Array.isArray(data.games) ? data.games : [];
      var owner = data.owner || friend.name;
      var seenAll = loadFriendSeen();
      var prevNames = seenAll[friend.url];
      var newNames = [];
      if(prevNames){
        var prevSet = {};
        prevNames.forEach(function(n){ prevSet[n] = true; });
        newNames = games.map(function(g){ return g.name; }).filter(function(n){ return !prevSet[n]; });
      }
      seenAll[friend.url] = games.map(function(g){ return g.name; });
      saveFriendSeen(seenAll);
      friendDataCache[friend.url] = { status: "ok", owner: owner, games: games, newNames: newNames };
      if(prevNames && newNames.length){
        showToast(owner + ": " + newNames.length + (newNames.length===1?" neues tauschbares Spiel":" neue tauschbare Spiele"));
      }
      if(state.view === "wishlist") render();
    })
    .catch(function(err){
      friendDataCache[friend.url] = { status: "error", error: err.message + " (Link falsch, nicht öffentlich erreichbar, oder Server erlaubt keine Browser-Anfragen/CORS)" };
      if(state.view === "wishlist") render();
    });
}

/* ---------------- storage (IndexedDB) ----------------
   localStorage has a ~5-10MB per-origin quota; a real collection with
   embedded base64 cover images blows well past that. IndexedDB has a
   much larger quota and is built for exactly this. Games live there;
   small settings (meta/nextcloud/friends/profile) stay in localStorage. */
var IDB_NAME = "bigbox-db";
var IDB_STORE = "kv";
var GAMES_IDB_KEY = "games";
function idbOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error("IndexedDB nicht verfügbar")); return; }
    var req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("IndexedDB konnte nicht geöffnet werden")); };
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, "readonly");
      var req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbSet(key, value){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function loadGamesAsync(){
  return idbGet(GAMES_IDB_KEY).then(function(arr){
    if(Array.isArray(arr) && arr.length) return arr;
    /* one-time migration from the old localStorage-based store */
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var old = JSON.parse(raw);
        if(Array.isArray(old) && old.length){
          return idbSet(GAMES_IDB_KEY, old).then(function(){
            localStorage.removeItem(STORAGE_KEY);
            return old;
          });
        }
      }
    }catch(e){}
    return SEED_GAMES.slice();
  }).catch(function(){ return SEED_GAMES.slice(); });
}
function persistGames(){
  idbSet(GAMES_IDB_KEY, state.games).catch(function(err){
    showToast("Speichern fehlgeschlagen: " + (err && err.message ? err.message : err));
  });
  scheduleAutoPush();
}

/* ---------------- CSV (matches Lazarus TForm1.SaveCSV/LoadCSV exactly) ---------------- */
function parseCSV(text){
  var lines = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n").filter(function(l){ return l.trim() !== ""; });
  if(!lines.length) return [];
  var start = /^Name\|/.test(lines[0]) ? 1 : 0;
  var out = [];
  for(var i=start;i<lines.length;i++){
    var parts = lines[i].split("|");
    var g = {};
    for(var k=0;k<CSV_KEYS.length;k++){ g[CSV_KEYS[k]] = parts[k] !== undefined ? parts[k] : ""; }
    if(g.name.trim() === "") continue;
    out.push(g);
  }
  return out;
}
function toCSV(games){
  var lines = [CSV_HEADER];
  games.forEach(function(g){
    lines.push(CSV_KEYS.map(function(k){ return (g[k]==null?"":String(g[k])).replace(/[\r\n]/g," "); }).join("|"));
  });
  return lines.join("\r\n") + "\r\n";
}

function zustandClass(z){
  z = (z||"").toLowerCase();
  if(z.indexOf("neu") === 0) return "good";
  if(z.indexOf("sehr gut") === 0) return "good";
  if(z.indexOf("gut") === 0) return "warn";
  if(z === "") return "neutral";
  return "warn";
}
var GENRE_PALETTE = ["#3a6ea5","#8a4f7d","#3f7d5c","#a3641f","#5a5aa0","#9a4a4a","#3f8a8a","#7a6a3a"];
function genreColor(genre){
  var s = genre || "Sonstige";
  var h = 0;
  for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return GENRE_PALETTE[h % GENRE_PALETTE.length];
}
function shade(hex, amt){
  var c = hex.replace("#","");
  var num = parseInt(c,16);
  var r = Math.min(255,Math.max(0,(num>>16)+amt));
  var g = Math.min(255,Math.max(0,((num>>8)&0xff)+amt));
  var b = Math.min(255,Math.max(0,(num&0xff)+amt));
  return "rgb("+r+","+g+","+b+")";
}
function coverMime(ext){
  ext = (ext||"").replace(".","").toLowerCase();
  if(ext==="jpg"||ext==="jpeg") return "image/jpeg";
  if(ext==="png") return "image/png";
  if(ext==="webp") return "image/webp";
  if(ext==="gif") return "image/gif";
  return "image/jpeg";
}
function hasCover(g){ return !!(g && g.coverBase64); }
function pcBadges(g){
  var out = [];
  if(g && g.useDosBox==="Ja") out.push('<span class="badge neutral">DOSBox eingerichtet</span>');
  if(g && g.useScummVM==="Ja") out.push('<span class="badge neutral">ScummVM eingerichtet</span>');
  return out.join('');
}
function tauschbarBadge(g){ return (g && g.tauschbar==="Ja") ? '<span class="badge trade">Tauschbar</span>' : ''; }
function coverBgStyle(g){
  if(hasCover(g)) return "background-image:url('data:"+coverMime(g.coverExt)+";base64,"+g.coverBase64+"')";
  var color = genreColor(g && g.genre);
  return "background:linear-gradient(160deg,"+color+","+shade(color,-25)+")";
}

/* ---------------- Nextcloud WebDAV sync ---------------- */
var pushTimer = null;
function scheduleAutoPush(){
  var nc = loadNC();
  if(!nc.url) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){
    pushToNextcloud();
    /* Keeps the published tauschliste.json (if any games are marked
       tauschbar) in step with every local edit - no separate manual
       "veröffentlichen" step needed once Nextcloud is connected once. */
    pushTauschlisteToNextcloud().catch(function(){});
  }, 1500);
}
function ncAuthHeader(nc){ return "Basic " + btoa(unescape(encodeURIComponent((nc.user||"")+":"+(nc.pass||"")))); }

function pushToNextcloud(){
  var nc = loadNC();
  if(!nc.url) return Promise.resolve();
  var csv = toCSV(state.games);
  return fetch(nc.url, {
    method: "PUT",
    headers: { "Authorization": ncAuthHeader(nc), "Content-Type": "text/csv" },
    body: csv
  }).then(function(res){
    if(!res.ok) throw new Error("HTTP " + res.status);
    var meta = loadMeta();
    meta.lastPush = Date.now();
    meta.lastSyncedHash = hashStr(csv);
    meta.lastError = null;
    saveMeta(meta);
    if(state.view === "sync") render();
  }).catch(function(err){
    var meta = loadMeta();
    meta.lastError = "Push fehlgeschlagen: " + err.message + " (evtl. CORS/Zugangsdaten prüfen)";
    saveMeta(meta);
    if(state.view === "sync") render();
  });
}

function hashStr(s){
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}

function pullFromNextcloud(silent){
  var nc = loadNC();
  if(!nc.url) return Promise.resolve();
  return fetch(nc.url, { headers: { "Authorization": ncAuthHeader(nc) }, cache: "no-store" })
    .then(function(res){
      if(!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(function(text){
      var meta = loadMeta();
      meta.lastPull = Date.now();
      meta.lastError = null;
      saveMeta(meta);
      var remoteHash = hashStr(text);
      if(remoteHash === meta.lastSyncedHash){ if(!silent){ showToast("Bereits aktuell."); } return; }
      var parsed = parseCSV(text);
      if(!parsed.length){ if(!silent) showToast("Remote-Datei leer oder unlesbar."); return; }
      state.confirm = {
        title: "Neue Version auf Nextcloud",
        msg: "Die Datei auf Nextcloud unterscheidet sich (" + parsed.length + " Spiele). Übernehmen und die " + state.games.length + " Spiele hier ersetzen?",
        okLabel: "Übernehmen",
        onOk: function(){
          state.games = parsed;
          persistGamesNoPush();
          var m = loadMeta(); m.lastSyncedHash = remoteHash; saveMeta(m);
          go("regal");
          showToast("Von Nextcloud übernommen: " + parsed.length + " Spiele.");
        }
      };
      render();
    })
    .catch(function(err){
      var meta = loadMeta();
      meta.lastError = "Abruf fehlgeschlagen: " + err.message + " (evtl. CORS/Zugangsdaten prüfen)";
      saveMeta(meta);
      if(!silent) showToast(meta.lastError);
      if(state.view === "sync") render();
    });
}

  });
}

/* ---------------- RAWG / IGDB (mirrors RawgApi.pas / IgdbApi.pas) ---------------- */
function rawgFetchGameData(name){
  var searchUrl = "https://api.rawg.io/api/games?key=" + RAWG_API_KEY + "&search=" + encodeURIComponent(name) + "&page_size=1";
  return fetch(searchUrl).then(function(r){ if(!r.ok) throw new Error("RAWG Suche: HTTP "+r.status); return r.json(); })
    .then(function(data){
      var hit = data.results && data.results[0];
      if(!hit) throw new Error("Kein Treffer bei RAWG.");
      var detailUrl = "https://api.rawg.io/api/games/" + hit.id + "?key=" + RAWG_API_KEY;
      return fetch(detailUrl).then(function(r){ if(!r.ok) throw new Error("RAWG Details: HTTP "+r.status); return r.json(); });
    })
    .then(function(d){
      return {
        jahr: d.released ? String(d.released).slice(0,4) : "",
        entwickler: (d.developers||[]).map(function(x){return x.name;}).join(" / "),
        publisher: (d.publishers||[]).map(function(x){return x.name;}).join(" / "),
        coverURL: d.background_image || ""
      };
    });
}
function igdbGetToken(){
  var url = "https://id.twitch.tv/oauth2/token?client_id=" + IGDB_CLIENT_ID + "&client_secret=" + IGDB_CLIENT_SECRET + "&grant_type=client_credentials";
  return fetch(url, { method: "POST" }).then(function(r){ if(!r.ok) throw new Error("Twitch-Login: HTTP "+r.status); return r.json(); })
    .then(function(d){ if(!d.access_token) throw new Error("Kein access_token von Twitch."); return d.access_token; });
}
function igdbFetchCoverURL(name){
  return igdbGetToken().then(function(token){
    var body = 'search "' + name.replace(/"/g,'\\"') + '"; fields name,cover.image_id; limit 1;';
    return fetch("https://api.igdb.com/v4/games", {
      method: "POST",
      headers: { "Client-ID": IGDB_CLIENT_ID, "Authorization": "Bearer " + token, "Content-Type": "text/plain" },
      body: body
    });
  }).then(function(r){ if(!r.ok) throw new Error("IGDB Suche: HTTP "+r.status); return r.json(); })
    .then(function(arr){
      var hit = arr && arr[0];
      if(!hit || !hit.cover || !hit.cover.image_id) throw new Error("Kein IGDB-Cover gefunden.");
      return "https://images.igdb.com/igdb/image/upload/t_cover_big/" + hit.cover.image_id + ".jpg";
    });
}
function urlToBase64(url){
  return fetch(url).then(function(r){ if(!r.ok) throw new Error("Bild-Download: HTTP "+r.status); return r.blob(); })
    .then(function(blob){
      return new Promise(function(resolve,reject){
        var reader = new FileReader();
        reader.onload = function(){ resolve(String(reader.result).split(",")[1] || ""); };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    });
}

/* downscale + compress a captured photo to keep localStorage lean */
function fileToCompressedBase64(file, maxDim){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      var scale = Math.min(1, (maxDim||900) / Math.max(w,h));
      var cw = Math.round(w*scale), ch = Math.round(h*scale);
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(img,0,0,cw,ch);
      var dataUrl = canvas.toDataURL("image/jpeg", 0.82);
      resolve(dataUrl.split(",")[1] || "");
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ---------------- barcode scanner (ZXing) ---------------- */
var zxingReader = null;
var scanStream = null;
function stopScanner(){
  if(zxingReader){ try{ zxingReader.reset(); }catch(e){} zxingReader = null; }
  if(scanStream){ try{ scanStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} scanStream = null; }
}
/* Must be called directly inside a click handler, with no render()/DOM
   rebuild in between - iOS Safari denies getUserMedia (NotAllowedError)
   if it isn't clearly still inside the user gesture. We grab the stream
   FIRST, then let the caller render the video element, then attach. */
function requestCameraStream(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return Promise.reject(new Error("Dieser Browser unterstützt keinen Kamerazugriff."));
  }
  return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
}
function attachScannerToVideo(videoEl, stream, onResult, onError){
  if(!window.ZXing){ onError("Scanner-Bibliothek konnte nicht geladen werden (kein Internet beim Laden der Seite?)."); return; }
  scanStream = stream;
  videoEl.srcObject = stream;
  videoEl.play().catch(function(){});
  try{
    zxingReader = new ZXing.BrowserMultiFormatReader();
    zxingReader.decodeFromStream(stream, videoEl, function(result){
      if(result){ onResult(result.getText()); }
    }).catch(function(err){ onError("Scanner-Fehler: " + err.message); });
  }catch(e){ onError("Scanner-Fehler: " + e.message); }
}
function cameraErrorMessage(err){
  if(err && err.name === "NotAllowedError") return "Kamera-Zugriff wurde blockiert. In Safari unter Einstellungen → Safari → Kamera (oder per Tippen auf das „aA“-Symbol in der Adressleiste → Website-Einstellungen) für diese Seite erlauben.";
  if(err && err.name === "NotFoundError") return "Keine Kamera gefunden.";
  return "Kamera nicht verfügbar: " + (err && err.message ? err.message : err);
}

var SORT_OPTIONS = [
  {id:"name", lb:"Name A–Z"},
  {id:"wert_asc", lb:"Wert ↑"},
  {id:"wert_desc", lb:"Wert ↓"},
  {id:"jahr", lb:"Jahr"},
  {id:"entwickler", lb:"Entwickler"}
];
function sortGames(list, sortBy){
  var out = list.slice();
  switch(sortBy){
    case "wert_asc": out.sort(function(a,b){ return parseWert(a.wert)-parseWert(b.wert) || a.name.localeCompare(b.name,"de"); }); break;
    case "wert_desc": out.sort(function(a,b){ return parseWert(b.wert)-parseWert(a.wert) || a.name.localeCompare(b.name,"de"); }); break;
    case "jahr": out.sort(function(a,b){ return (parseInt(a.jahr,10)||9999)-(parseInt(b.jahr,10)||9999) || a.name.localeCompare(b.name,"de"); }); break;
    case "entwickler": out.sort(function(a,b){ return (a.entwickler||"").localeCompare(b.entwickler||"","de") || a.name.localeCompare(b.name,"de"); }); break;
    default: out.sort(function(a,b){ return a.name.localeCompare(b.name,"de"); });
  }
  return out;
}
function viewSearch(){

  var q = state.query.trim().toLowerCase();
  var results = state.games.filter(function(g){
    if(state.filterMedium && g.medium !== state.filterMedium) return false;

    (mediums.length ? '<div class="chiprow">'+mediums.map(function(m){ return '<button class="filterchip'+(state.filterMedium===m?' active':'')+'" data-medium="'+esc(m)+'">'+esc(m)+'</button>'; }).join('')+'</div>' : '')+

  '</div>';

function viewStats(){
  var games = state.games;
  var total = games.length, sum = totalValue(), avg = total ? sum/total : 0;
  var years = games.map(function(g){ return parseInt(g.jahr,10); }).filter(function(y){ return y && !isNaN(y); });
  var yrRange = years.length ? (Math.min.apply(null,years)+" – "+Math.max.apply(null,years)) : "—";
  function counts(field){
    var m = {};
    games.forEach(function(g){ var v = (g[field]||"").trim() || "Unbekannt"; m[v] = (m[v]||0)+1; });
    return Object.keys(m).map(function(k){ return [k,m[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  }
  function barsHtml(pairs, limit){
    var top = pairs.slice(0, limit||8);

    '<div class="stat-tile"><div class="lb">Jahresspanne</div><div class="v tnum" style="font-size:17px">'+yrRange+'</div></div>'+
  '</div>';

/* ---------------- main render ---------------- */
function render(){
  var root = document.getElementById("app");
  var html = "";
  switch(state.view){
    case "regal": html = viewRegal(); break;
    case "search": html = viewSearch(); break;
    case "more": html = viewMore(); break;
    case "stats": html = viewStats(); break;
    case "sync": html = viewSync(); break;
    case "wishlist": html = viewWishlist(); break;
    case "edit": html = viewEdit(); break;
    default: html = viewRegal();
  }
  root.innerHTML = html;

  var toastHost = document.getElementById("toastHost");
  toastHost.innerHTML = state.toast ? '<div class="toast">'+esc(state.toast)+'</div>' : "";
  if(state.confirm){
    toastHost.innerHTML += '<div class="confirm-backdrop" id="confirmBackdrop"><div class="confirm-sheet">'+
      '<h3>'+esc(state.confirm.title)+'</h3><p>'+esc(state.confirm.msg)+'</p>'+
      '<div class="actions"><button class="btn ghost" id="confirmCancel">Abbrechen</button><button class="btn primary" id="confirmOk">'+esc(state.confirm.okLabel||"OK")+'</button></div>'+
    '</div></div>';
  }
  wireEvents(root);
  wireToastEvents();
}
function wireToastEvents(){
  var cancel = document.getElementById("confirmCancel");
  var ok = document.getElementById("confirmOk");
  if(cancel) cancel.onclick = function(){ state.confirm = null; render(); };
  if(ok) ok.onclick = function(){ var fn = state.confirm && state.confirm.onOk; state.confirm = null; if(fn) fn(); render(); };
}

function wireEvents(root){
  root.querySelectorAll("[data-tab]").forEach(function(el){
    el.addEventListener("click", function(){
      var tab = el.getAttribute("data-tab");
      if(tab === "wishlist"){ friendDataCache = {}; }
      go(tab);
    });
  });
  root.querySelectorAll("[data-canceledit]").forEach(function(el){
    el.addEventListener("click", function(){
      state.addFlow = null; state.matchResult = null;
      go("search");
    });
  });
  root.querySelectorAll("[data-edit]").forEach(function(el){
    el.addEventListener("click", function(){
      var name = el.getAttribute("data-edit");
      var idx = findIndex(name);
      go("edit", { editing: name, addFlow: Object.assign({}, idx>=0 ? state.games[idx] : BLANK_GAME), matchResult: null });
    });
  });
  root.querySelectorAll("[data-newgame]").forEach(function(el){ el.addEventListener("click", function(){ go("edit", {editing:null, addFlow: Object.assign({}, BLANK_GAME), matchResult:null}); }); });
  root.querySelectorAll("[data-delete]").forEach(function(el){
    el.addEventListener("click", function(){
      var name = el.getAttribute("data-delete");
      state.confirm = { title:"Spiel löschen?", msg:'"'+name+'" wird endgültig entfernt.', okLabel:"Löschen",
        onOk:function(){ var idx=findIndex(name); if(idx>=0){ state.games.splice(idx,1); persistGames(); } go("search"); showToast("Gelöscht."); } };
      render();
    });
  });
  root.querySelectorAll("[data-sort]").forEach(function(el){ el.addEventListener("click", function(){ state.sortBy = el.getAttribute("data-sort"); render(); }); });
  root.querySelectorAll("[data-medium]").forEach(function(el){ el.addEventListener("click", function(){ var v=el.getAttribute("data-medium"); state.filterMedium = state.filterMedium===v?null:v; render(); }); });
  root.querySelectorAll("[data-zustand]").forEach(function(el){ el.addEventListener("click", function(){ var v=el.getAttribute("data-zustand"); state.filterZustand = state.filterZustand===v?null:v; render(); }); });

  var searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", function(){
      state.query = searchInput.value; render();
      var again = document.getElementById("searchInput");
      if(again){ again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
  }
  root.querySelectorAll("[data-pill]").forEach(function(el){
    el.addEventListener("click", function(){
      var group = el.getAttribute("data-pill");
      root.querySelectorAll('[data-pill="'+group+'"]').forEach(function(p){ p.classList.remove("active"); });
      el.classList.add("active");
    });
  });

  /* capture flow (available both when adding a new game and when editing one) */
  var btnCapturePhoto = document.getElementById("btnCapturePhoto");
  var capturePhoto = document.getElementById("capturePhoto");
  if(btnCapturePhoto && capturePhoto){
    btnCapturePhoto.addEventListener("click", function(){ capturePhoto.click(); });
    capturePhoto.addEventListener("change", function(){
      var file = capturePhoto.files && capturePhoto.files[0];
      if(!file) return;
      fileToCompressedBase64(file, 900).then(function(b64){
        state.addFlow = Object.assign({}, state.addFlow || BLANK_GAME, { coverBase64: b64, coverExt: ".jpg" });
        showToast("Foto übernommen.");
        render();
      }).catch(function(){ showToast("Foto konnte nicht verarbeitet werden."); });
    });
  }
  var btnStartScan = document.getElementById("btnStartScan");
  if(btnStartScan){
    btnStartScan.addEventListener("click", function(){
      /* getUserMedia is requested HERE, synchronously in the click handler,
         before any render() touches the DOM - iOS Safari denies the prompt
         (NotAllowedError) if that boundary isn't crisp. */
      requestCameraStream().then(function(stream){
        state.scanBusy = true; render();
        var video = document.getElementById("scanVideo");
        if(!video){ stream.getTracks().forEach(function(t){t.stop();}); return; }
        attachScannerToVideo(video, stream, function(text){
          state.scanBusy = false; stopScanner();
          var patch = { };
          if(!(state.addFlow && state.addFlow.name)) patch.name = text;
          state.addFlow = Object.assign({}, state.addFlow || BLANK_GAME, patch);
          showToast("Barcode gelesen: " + text);
          render();
        }, function(err){ state.scanBusy = false; stopScanner(); showToast(err); render(); });
      }).catch(function(err){ showToast(cameraErrorMessage(err)); });
    });
  }
  var btnStopScan = document.getElementById("btnStopScan");
  if(btnStopScan) btnStopScan.addEventListener("click", function(){ state.scanBusy = false; stopScanner(); render(); });

  var btnMatch = document.getElementById("btnMatch");
  if(btnMatch){
    btnMatch.addEventListener("click", function(){
      var name = document.getElementById("f_name").value.trim();
      if(!name){ showToast("Bitte zuerst einen Namen eingeben."); return; }
      state.addFlow = Object.assign({}, state.addFlow || BLANK_GAME, { name: name });
      state.matchBusy = true; state.matchResult = null; render();
      var rawgP = rawgFetchGameData(name).catch(function(e){ return { error: e.message }; });
      rawgP.then(function(rawg){
        var base = rawg.error ? { jahr:"", entwickler:"", publisher:"" } : rawg;
        return igdbFetchCoverURL(name).then(function(coverUrl){ return urlToBase64(coverUrl).then(function(b64){ base.coverBase64 = b64; return base; }); })
          .catch(function(e){ base.igdbError = e.message; return base; })
          .then(function(res){
            state.matchBusy = false;
            if(rawg.error && res.igdbError){ state.matchResult = { error: "RAWG: "+rawg.error+" · IGDB: "+res.igdbError }; }
            else { state.matchResult = res; }
            render();
          });
      });
    });
  }
  var btnUseMatch = document.getElementById("btnUseMatch");
  if(btnUseMatch){
    btnUseMatch.addEventListener("click", function(){
      var m = state.matchResult || {};
      var patch = { jahr: m.jahr||"", entwickler: m.entwickler||"", publisher: m.publisher||"" };
      if(m.coverBase64 && !hasCover(state.addFlow)){ patch.coverBase64 = m.coverBase64; patch.coverExt = ".jpg"; }
      state.addFlow = Object.assign({}, state.addFlow || BLANK_GAME, patch);
      showToast("Übernommen.");
      render();
    });
  }
  var btnSave = document.getElementById("btnSave");
  if(btnSave){
    btnSave.addEventListener("click", function(){
      var name = document.getElementById("f_name").value.trim();
      if(!name){ showToast("Bitte einen Namen eingeben."); return; }
      var isNew = state.editing === null;
      var existingIdx = findIndex(isNew ? name : state.editing);
      var base = Object.assign({}, state.addFlow || BLANK_GAME);

      base.name = name;
      base.publisher = document.getElementById("f_publisher").value;
      base.entwickler = document.getElementById("f_entwickler").value;
      base.jahr = document.getElementById("f_jahr").value;
      base.wert = document.getElementById("f_wert").value;
      base.genre = document.getElementById("f_genre").value;
      base.sprache = document.getElementById("f_sprache").value;
      base.plattform = document.getElementById("f_plattform").value;
      base.inhalt = document.getElementById("f_inhalt").value;
      base.vollstaendig = document.getElementById("f_voll").checked ? "Ja" : "Nein";
      base.tauschbar = document.getElementById("f_tauschbar").checked ? "Ja" : "Nein";
      var zPicked = root.querySelector('[data-pill="zustand"].active');
      if(zPicked) base.zustand = zPicked.getAttribute("data-val");
      var mPicked = root.querySelector('[data-pill="medium"].active');
      if(mPicked) base.medium = mPicked.getAttribute("data-val");

      if(isNew){
        if(findIndex(name) >= 0){ showToast("Ein Spiel mit diesem Namen existiert bereits."); return; }
        state.games.push(base);
      } else if(existingIdx>=0){
        state.games[existingIdx] = base;
      }
      persistGames();
      state.addFlow = null; state.matchResult = null;
      go("search");
      showToast(isNew ? "Hinzugefügt." : "Gespeichert.");
    });
  }

  /* CSV file export/import (manual fallback) */
  var btnExport = document.getElementById("btnExport");
  if(btnExport){
    btnExport.addEventListener("click", function(){
      var csv = toCSV(state.games);
      var blob = new Blob([csv], {type:"text/csv"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "spiele_export.csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      showToast("CSV exportiert.");
    });
  }
  var btnImport = document.getElementById("btnImport");
  var filePick = document.getElementById("filePick");
  if(btnImport && filePick){
    btnImport.addEventListener("click", function(){ filePick.click(); });
    filePick.addEventListener("change", function(){
      var file = filePick.files && filePick.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var parsed;
        try{ parsed = parseCSV(String(reader.result)); }catch(e){ parsed = []; }
        if(!parsed.length){ showToast("Datei konnte nicht gelesen werden."); return; }
        state.confirm = { title:"Bestand ersetzen?", msg:"Die Datei enthält "+parsed.length+" Spiele und ersetzt die aktuell "+state.games.length+" Spiele auf diesem Handy.", okLabel:"Importieren",
          onOk:function(){ state.games = parsed; persistGames(); var m=loadMeta(); m.lastPull=Date.now(); saveMeta(m); go("regal"); showToast("Import abgeschlossen: "+parsed.length+" Spiele."); } };
        render();
      };
      reader.readAsText(file, "utf-8");
      filePick.value = "";
    });
  }

  /* nextcloud settings */
  var ncTogglePass = document.getElementById("ncTogglePass");
  if(ncTogglePass){
    ncTogglePass.addEventListener("click", function(){
      var f = document.getElementById("nc_pass");
      f.type = f.type === "password" ? "text" : "password";
    });
  }
  var ncSave = document.getElementById("ncSave");
  if(ncSave){
    ncSave.addEventListener("click", function(){
      var nc = { url: document.getElementById("nc_url").value.trim(), user: document.getElementById("nc_user").value.trim(), pass: document.getElementById("nc_pass").value.trim() };
      saveNC(nc);
      showToast("Gespeichert.");
      render();
      if(nc.url) pullFromNextcloud(true);
    });
  }
  var ncPullNow = document.getElementById("ncPullNow");
  if(ncPullNow){
    ncPullNow.addEventListener("click", function(){
      showToast("Rufe ab…");
      pullFromNextcloud(false);
    });
  }
  var ncPushNow = document.getElementById("ncPushNow");
  if(ncPushNow){
    ncPushNow.addEventListener("click", function(){
      showToast("Lade hoch…");
      pushToNextcloud().then(function(){ showToast("Hochgeladen."); render(); })
        .catch(function(err){ showToast("Hochladen fehlgeschlagen: " + err.message); });
    });
  }

  /* Wunschliste / Tauschbörse */
  var f_displayname = document.getElementById("f_displayname");
  if(f_displayname){
    f_displayname.addEventListener("change", function(){
      saveProfile({ displayName: f_displayname.value.trim() });
    });
  }
  var btnExportTausch = document.getElementById("btnExportTausch");
  if(btnExportTausch){
    btnExportTausch.addEventListener("click", function(){
      var name = document.getElementById("f_displayname");
      if(name) saveProfile({ displayName: name.value.trim() });
      exportTauschlisteFile();
      showToast("Tauschliste exportiert.");
    });
  }
  var btnPushTausch = document.getElementById("btnPushTausch");
  if(btnPushTausch){
    btnPushTausch.addEventListener("click", function(){
      var name = document.getElementById("f_displayname");
      if(name) saveProfile({ displayName: name.value.trim() });
      showToast("Lade hoch…");
      pushTauschlisteToNextcloud().then(function(url){
        showToast("Hochgeladen. Jetzt in Nextcloud einen öffentlichen Link für „tauschliste.json“ erstellen.");
      }).catch(function(err){ showToast("Fehlgeschlagen: " + err.message); });
    });
  }
  var btnAddFriend = document.getElementById("btnAddFriend");
  if(btnAddFriend){
    btnAddFriend.addEventListener("click", function(){
      var name = document.getElementById("f_friendname").value.trim();
      var url = document.getElementById("f_friendurl").value.trim();
      if(!name || !url){ showToast("Bitte Name und Link eintragen."); return; }
      var friends = loadFriends();
      friends.push({ name: name, url: url });
      saveFriends(friends);
      delete friendDataCache[url];
      showToast("Freund hinzugefügt.");
      render();
    });
  }
  root.querySelectorAll("[data-removefriend]").forEach(function(el){
    el.addEventListener("click", function(){
      var url = el.getAttribute("data-removefriend");
      var friends = loadFriends().filter(function(f){ return f.url !== url; });
      saveFriends(friends);
      delete friendDataCache[url];
      var seenAll = loadFriendSeen();
      delete seenAll[url];
      saveFriendSeen(seenAll);
      render();
    });
  });
}

/* ---------------- boot ---------------- */
render();
loadGamesAsync().then(function(games){
  state.games = games;
  state.gamesLoaded = true;
  render();
  var __nc0 = loadNC();
  if(__nc0.url){ setTimeout(function(){ pullFromNextcloud(true); }, 800); }
});
})();
</script>
</body>
</html>
